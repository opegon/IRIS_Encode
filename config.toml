[app]
language = "fr"

[ffmpeg]
fetch_url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
auto_install = true
bin_dir = "./bin"

[updates]
check_on_startup = true

[meta]
omdb_api_key = "REVOQUEE"

[decision]
# Sources dont width OU height dépasse ces seuils sont traitées comme du 1080p :
# résolution d'origine conservée (pas de downscale 720p) et encodage HEVC.
# Utile pour les fichiers proches du 1080p mais rognés (ex. 1918x1040, 1920x800).
near_1080p_min_width = 1600
near_1080p_min_height = 850

[tui.browser.columns]
fichier = 50
taille = 8
resolution = 10
duree = 6
debit = 6
codec = 6
dolby_vision = 8
decision = 8
audio = 16

[tui.dryrun.columns]
fichier = 48
conteneur = 10
audio = 54
estim = 18
action = 10
dv = 6

[tui.tracks.columns]
codec = 12
src = 26
