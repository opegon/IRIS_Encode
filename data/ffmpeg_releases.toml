# Archive portable : exécutables CLI liés statiquement, aucune DLL.
# Seul mkvmerge.exe est extrait vers ./bin/.
# Pas de build statique officiel sous Linux → gestionnaire de paquets.
# Build portable : mpv.exe est autonome, les DLL de l'archive ne servent
# qu'aux anciennes versions de Windows. Pas de .zip publié, d'où l'extraction
# 7z via le tar/libarchive fourni avec Windows.
[mpv.windows]
url     = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260814/mpv-x86_64-20260814-git-7b8915bc1d.7z"
sha256  = "1bf3b029da2c98e605e00e85f21ee3142f22a1dcc4ceb5c827b5c51e36e390f9"
version = "0.41.0"

[mkvtoolnix.windows]
url     = "https://mkvtoolnix.download/windows/releases/101.0/mkvtoolnix-64-bit-101.0.zip"
sha256  = "59a807b45b34ac524dfdef61edcf0642ee9bd6b08c130cfc078532c362569abc"
version = "101.0"

# Shader de super-résolution (IE-168) : ArtCNN C4F16, licence MIT, toutes
# plateformes. `sha256` : l'asset publié (champ `digest` de GitHub). La copie
# posée dans bin/shaders/ perd ses lignes `//!WHEN` (note D13) : `sha256_copie`
# est l'empreinte de cette copie.
[artcnn]
url          = "https://github.com/Artoriuz/ArtCNN/releases/download/v1.6.2/ArtCNN_C4F16.glsl"
sha256       = "03d0b3d31cb82c898a94a46663021a3e8f02c5a21d69c5cfdf0208de4bfd453e"
sha256_copie = "643f9870ab0289158eec4a2d2ed1d0b757643e686973d2368c63d81eaab0c080"
version      = "1.6.2"

# OCR des sous-titres image (IE-176) : seconv, la ligne de commande de
# Subtitle Edit (licence MIT), exécutable autonome avec ses deux DLL, posé dans
# bin/seconv/. Moteur nOCR : sa base Latin.nocr ; correction des erreurs d'OCR
# en français : listes de Subtitle Edit et dictionnaire Hunspell de
# LibreOffice (MPL 2.0). L'anglais est intégré à seconv. Chaque donnée est
# épinglée à un commit, son empreinte ne bouge donc pas.
[seconv.windows]
url     = "https://github.com/SubtitleEdit/subtitleedit/releases/download/v5.4.0/SeConv-Windows-x64.zip"
sha256  = "aea19664f460fcfb84e8ba8eca72419091818c6005d4e063d9950c41ea81062d"
version = "5.4.0"

