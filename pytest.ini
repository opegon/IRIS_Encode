; Configuration de la suite (IE-196, CR-147).
[pytest]
testpaths = tests
; Un marqueur mal orthographié (`@pytest.mark.skipf`) ne marquait rien, sans
; rien dire : il doit être déclaré ci-dessous, sinon la collecte échoue. Tout
; comme une clé inconnue dans ce fichier.
addopts = --strict-markers --strict-config
; Un avertissement est une erreur : une dépréciation de Textual ou de Python
; se voit le jour où elle apparaît, pas le jour où l'API disparaît.
filterwarnings =
    error
